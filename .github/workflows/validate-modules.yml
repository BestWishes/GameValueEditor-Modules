name: Validate game modules

on:
  pull_request:
    paths:
      - "games/**"
      - "sdk/**"
      - "schemas/**"
      - "scripts/**"
      - "catalog.json"

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject generated contributor edits
        shell: pwsh
        run: |
          $changed = git diff --name-only "origin/${{ github.base_ref }}...HEAD"
          if ($changed -match '^games/.+/contributors\.generated\.json$') {
            throw 'contributors.generated.json is maintained by automation.'
          }
      - name: Validate manifests and catalog
        shell: pwsh
        run: ./scripts/validate-modules.ps1
      - name: Build all modules
        run: dotnet build GameValueEditor.Modules.slnx -c Release
